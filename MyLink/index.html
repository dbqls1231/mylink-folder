<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyLink</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf7ff;
            text-align: center;
            padding: 60px 20px;
        }

        .profile {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 4px 15px #d3e8f5;
        }

        h1 {
            color: #222;
        }

        p {
            color: #777;
        }

        a {
            display: block;
            background: #7bc8f6;
            color: white;
            padding: 15px;
            margin-top: 15px;
            border-radius: 10px;
            text-decoration: none;
        }

        a:hover {
            background: #58b6ed;
        }
    </style>
</head>
<body>
    <div class="profile">
        <h1>MyLink</h1>
        <p>제 링크페이지 입니다.</p>
        <a href="https://github.com/dbqls1231">
            유빈 GITHUB 방문하기
        </a>
    </div>
</body>
</html>
